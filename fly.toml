# Fly.io configuration for Folio. The GitHub Action passes the app name itself
# (repository variable FLY_APP); this value is used for manual `fly deploy`.
app = "folio-drpaulfarrow"
primary_region = "lhr"

[env]
  PORT = "8080"
  DATA_DIR = "/data"

# Uploaded PDFs live on this volume and survive deploys and restarts.
[mounts]
  source = "folio_data"
  destination = "/data"
  initial_size = "1gb"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "256mb"
