# Fly.io configuration for Folio. Change `app` if the name is taken.
app = "folio-reader"

[env]
  PORT = "8080"
  DATA_DIR = "/data"

# Uploaded PDFs live on this volume and survive deploys and restarts.
[mounts]
  source = "folio_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "256mb"
